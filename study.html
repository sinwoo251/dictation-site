<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>받아쓰기 · 받아쓰기</title>
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#1f1d1a; --muted:#7a746a; --line:#e4ddd0;
  --accent:#2f5d50; --accent-ink:#fff; --ok:#2e7d4f; --ok-bg:#e3f2e8;
  --bad:#c0392b; --bad-bg:#fbe7e4; --warn:#b7791f; --warn-bg:#fdf1dc; --soft:#efe9dd; --star:#e0a100;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --paper:#1f2125; --ink:#ece8e1; --muted:#9a948a; --line:#33363c;
    --accent:#7fc4ae; --accent-ink:#10201b; --ok:#6fd39a; --ok-bg:#1d3326;
    --bad:#f08a7d; --bad-bg:#3a2220; --warn:#e9b660; --warn-bg:#3a2f1c; --soft:#2a2c31; --star:#f2c14e;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
.authbtn{float:right;border:1px solid var(--line,#ddd);background:none;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:inherit}
.yt{position:relative;width:100%;max-width:420px;margin:0 auto 12px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.yt iframe,.yt #ytFrame,.yt .fake-yt{position:absolute;inset:0;width:100%;height:100%;color:#fff}
.yt-start{position:absolute;inset:0;width:100%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
.yt-err{position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:#222;color:#fff;font-size:15px}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 80px}
header h1{font-size:22px;line-height:1.35;margin:0 0 6px;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:13.5px}
.meta a{color:inherit}
.bar{height:6px;background:var(--soft);border-radius:99px;margin:18px 0 10px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px}
.dot{width:30px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--paper);
  font-size:11.5px;color:var(--muted);cursor:pointer;font-family:var(--mono);padding:0}
.dot.perfect{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.dot.tried{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.dot.revealed{background:var(--soft);color:var(--muted);text-decoration:line-through}
.dot.skip{border-style:dashed;color:var(--muted);background:transparent}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}
.dot{position:relative}
.dot.star::after{content:"★";position:absolute;top:-7px;right:-5px;font-size:11px;line-height:1;color:var(--star);
  text-shadow:0 0 2px var(--bg),0 0 2px var(--bg)}
.dots.staronly .dot:not(.star){opacity:.28}
.filters{display:flex;align-items:center;gap:8px;margin:-6px 0 14px;font-size:13px;color:var(--muted)}
.filters .chip:disabled{opacity:.45;cursor:default}
.starbtn{border:0;background:none;cursor:pointer;font-size:24px;line-height:1;color:var(--line);padding:2px 4px}
.starbtn.on{color:var(--star)}
.starbtn:hover{color:var(--star)}
.wrongs{font-size:12.5px;color:var(--muted)}
.wrongs.hot{color:var(--bad)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;
  box-shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -16px rgba(0,0,0,.18)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
  cursor:pointer;display:grid;place-items:center;flex:none;transition:transform .1s}
.play:active{transform:scale(.95)}
.play svg{width:26px;height:26px}
.num{font-family:var(--mono);font-size:13px;color:var(--muted)}
.num b{font-size:20px;color:var(--ink)}
.speeds{display:flex;gap:4px;margin-left:auto}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;
  padding:4px 10px;font-size:13px;cursor:pointer;font-family:var(--mono)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
textarea{width:100%;min-height:96px;margin:18px 0 12px;padding:14px;border-radius:12px;resize:vertical;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:18px/1.55 inherit;font-family:inherit}
textarea:focus{outline:none;border-color:var(--accent)}
.hint{font-family:var(--mono);font-size:15px;color:var(--muted);letter-spacing:.02em;margin:-4px 0 12px;word-spacing:.25em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;
  padding:9px 14px;font-size:14.5px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.right{margin-left:auto}
.result{margin-top:18px;padding:16px;border-radius:12px;background:var(--bg);font-size:18px;line-height:1.9;display:none}
.result.show{display:block}
.score{font-size:13.5px;color:var(--muted);margin-bottom:4px}
.score b{font-size:15px}
.w{padding:1px 2px;border-radius:4px}
.w.ok{color:var(--ok)}
.w.miss{color:var(--bad);background:var(--bad-bg);font-weight:600}
.alt{font-size:12.5px;color:var(--muted);margin:0 4px 0 2px;white-space:nowrap}
.w.filler{color:var(--muted);opacity:.6;font-style:italic}
.w.extra{color:var(--muted);text-decoration:line-through}
.w.sub del{color:var(--muted);margin-right:3px}
.w.sub ins{text-decoration:none;color:var(--bad);background:var(--bad-bg);font-weight:600;border-radius:4px;padding:0 2px}
.answer{margin-top:8px;font-size:16px;color:var(--muted)}
.korow{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:15.5px;line-height:1.6}
.kobtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:3px 11px;font-size:13px;cursor:pointer;font-family:inherit}
.kobtn.on{color:var(--ink);border-color:var(--muted)}
.ko{margin-top:8px;color:var(--ink)}
.script p .sko{display:block;font-family:inherit;margin-right:0;color:var(--muted);font-size:13.5px;margin:2px 0 0 26px}
.keys{color:var(--muted);font-size:12.5px;margin-top:14px}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--paper)}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
.script p{margin:6px 0;font-size:15px}
.script p span{font-family:var(--mono);color:var(--muted);font-size:12px;margin-right:8px}
.footer{display:flex;justify-content:space-between;margin-top:18px;color:var(--muted);font-size:12.5px}
.tools{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.w[data-si]{cursor:pointer}
.w[data-si]:hover{outline:1.5px dashed var(--muted);outline-offset:1px}
.w.saved{box-shadow:inset 0 -2px 0 var(--accent)}
.wordhint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.syncnote{margin-left:6px;opacity:.75}
.src{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emptyrev{text-align:center;padding:40px 20px;font-size:18px}
.emptyrev span{font-size:14px;color:var(--muted)}
.tips{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:15px;line-height:1.5}
.tipbody{margin-top:8px}
.tiph{font-size:12.5px;color:var(--bad);font-weight:600;margin:6px 0 2px}
.tiplist,.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.notes li{background:var(--soft);border-radius:8px;padding:6px 10px;font-size:14.5px}
.tip{padding:4px 0 4px 26px;position:relative}
.tip .ti{position:absolute;left:0;top:3px;font-size:14px}
.tip.hot b{color:var(--bad)}
.tip .say{font-family:var(--mono);font-size:14px;color:var(--accent)}
.tip .tl{font-size:11.5px;color:var(--muted);background:var(--soft);border-radius:99px;padding:0 7px;margin-left:4px}
.tip .tn{font-size:13px;color:var(--muted)}
.tipmore{margin-top:6px;border:0;padding:0}
.tipmore summary{font-size:13px;color:var(--muted);cursor:pointer}
.tipmore .tiplist{margin-top:6px}
.lvrow{margin-top:-8px}
.lvlab{font-size:12.5px;color:var(--muted);margin-right:2px}
.chip.lv.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lvnote{font-size:12.5px;color:var(--muted)}
.lvbadge{font-size:13px;font-weight:700;vertical-align:middle;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:2px 10px}
.cloze{margin:18px 0 12px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;line-height:2.2}
.cz-w{color:var(--ink)}
.cz-in{font:inherit;font-size:17px;border:0;border-bottom:2px solid var(--accent);background:var(--paper);color:var(--ink);border-radius:6px 6px 0 0;
  padding:1px 6px;margin:0 1px;min-width:3ch;text-align:center}
.cz-in:focus{outline:2px solid var(--accent);outline-offset:1px}
.cz-in.ok{border-color:var(--ok);background:var(--ok-bg)} .cz-in.bad{border-color:var(--bad);background:var(--bad-bg)}
.cz-in.shown{color:var(--muted);font-style:italic}
.w.given{color:var(--muted)}
.liblink{display:inline-block;margin-bottom:8px;color:var(--muted);font-size:13.5px;text-decoration:none}
.liblink:hover{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}
.blockdone{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-size:15px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blockdone .btn{padding:6px 12px;font-size:14px}
#watchBtn.watched{border-color:var(--ok);color:var(--ok)}
#watchBtn.locked{opacity:.6;border-style:dashed}
.player{position:fixed;inset:0;background:rgba(10,10,10,.55);display:grid;place-items:center;z-index:20;padding:16px}
.player[hidden]{display:none}
.pl-box{background:var(--paper);color:var(--ink);border-radius:18px;width:100%;max-width:720px;padding:22px 24px 20px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}
.pl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pl-head b{font-size:16px}
.pl-x{background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer;padding:4px 8px}
.pl-sub{min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}
.pl-line{margin:0}
.pl-line.prev,.pl-line.next{font-size:14.5px;color:var(--muted);opacity:.55;min-height:1.4em}
.pl-line.cur{font-size:23px;line-height:1.5;font-weight:500}
.wd{color:var(--muted);transition:color .12s}
.wd.done{color:var(--ink)}
.wd.now{color:var(--accent);text-decoration:underline;text-underline-offset:5px}
.wd[data-f]{font-style:italic;opacity:.6}
.pl-ko{margin:0;font-size:16px;color:var(--accent)}
.pl-bar{height:5px;background:var(--soft);border-radius:99px;overflow:hidden;margin:16px 0 14px}
.pl-bar>i{display:block;height:100%;width:0;background:var(--accent)}
.pl-ctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pl-ctrl .play{width:52px;height:52px}
.pl-time{font-family:var(--mono);font-size:13px;color:var(--muted)}
.pl-tog{margin-left:auto;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.pl-done{color:var(--ok);font-size:14px}
@media (max-width:520px){ .pl-line.cur{font-size:19px} .pl-box{padding:18px 16px} }
/* ── 완료 카드 (A-6) ── */
.pack{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;
  background:radial-gradient(ellipse at center,rgba(20,22,30,.86),rgba(5,6,10,.96))}
.pack[hidden]{display:none}
.pk-stage{position:relative;width:280px;height:420px;perspective:1200px}
.pk-pack{position:absolute;inset:12px 18px;border-radius:14px;cursor:pointer;overflow:hidden;
  background:linear-gradient(150deg,#1d3b33,#2f5d50 45%,#c9a34a 100%);box-shadow:0 20px 60px -10px rgba(0,0,0,.7);
  display:grid;place-items:center;text-align:center;color:#fff;font-size:15px;letter-spacing:.06em;
  animation:pk-shake 1.6s ease-in-out infinite}
.pk-pack b{display:block;font-size:30px;letter-spacing:.02em;margin-top:6px}
.pk-pack small{display:block;margin-top:14px;font-size:12px;opacity:.75;letter-spacing:0}
.pk-shine{position:absolute;inset:-50%;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);
  animation:pk-shine 2.2s linear infinite}
@keyframes pk-shine{from{transform:translateX(-40%)}to{transform:translateX(40%)}}
@keyframes pk-shake{0%,100%{transform:rotate(0)}10%{transform:rotate(-2deg)}20%{transform:rotate(2deg)}30%{transform:rotate(-1deg)}40%{transform:rotate(0)}}
.pk-pack.open{animation:pk-open .55s ease-in forwards;pointer-events:none}
@keyframes pk-open{to{transform:scale(1.25);opacity:0;filter:brightness(2.5)}}
.pk-flash{position:absolute;inset:-60%;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,var(--glow,#fff) 0%,transparent 60%)}
.pk-flash.go{animation:pk-flash 1s ease-out forwards}
@keyframes pk-flash{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.pk-hint{position:absolute;left:0;right:0;bottom:-40px;text-align:center;color:#cfd3da;font-size:14px;margin:0}
.pk-actions{position:absolute;left:0;right:0;bottom:-58px;display:flex;gap:8px;justify-content:center}
.pk-actions[hidden]{display:none}
.fcard{position:absolute;inset:0;opacity:0;transform:rotateY(180deg) scale(.8);transform-style:preserve-3d;pointer-events:none}
.fcard.show{animation:fc-in .9s cubic-bezier(.2,.9,.25,1.15) forwards;pointer-events:auto}
@keyframes fc-in{0%{opacity:0;transform:rotateY(180deg) scale(.8)}40%{opacity:1}100%{opacity:1;transform:rotateY(0) scale(1)}}
.fc{position:absolute;inset:0;padding:22px 22px 18px;color:var(--fc-ink);background:var(--fc-bg);
  clip-path:polygon(50% 0,100% 6%,100% 88%,50% 100%,0 88%,0 6%);display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.fc::before{content:"";position:absolute;inset:7px;clip-path:polygon(50% 0,100% 6%,100% 88%,50% 100%,0 88%,0 6%);
  border:1.5px solid var(--fc-line);pointer-events:none}
.fc.t-bronze{--fc-bg:linear-gradient(160deg,#e7b98a,#a8683c 55%,#6e3f1f);--fc-ink:#2a160a;--fc-line:rgba(60,30,10,.35)}
.fc.t-silver{--fc-bg:linear-gradient(160deg,#f4f6f8,#b8bfc8 55%,#7d8691);--fc-ink:#1d232b;--fc-line:rgba(30,40,50,.3)}
.fc.t-gold{--fc-bg:linear-gradient(160deg,#fff1b8,#e5bd4f 50%,#a77a16);--fc-ink:#2b1f00;--fc-line:rgba(70,50,0,.35)}
.fc.t-icon{--fc-ink:#fff;--fc-line:rgba(255,255,255,.5);
  --fc-bg:linear-gradient(135deg,#3b1d6e,#1f6f8b 30%,#2aa876 50%,#d4a017 70%,#b83280 90%);background-size:300% 300%;
  animation:fc-holo 5s ease infinite}
@keyframes fc-holo{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.fc-top{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.fc-ovr{display:flex;flex-direction:column;align-items:center;min-width:64px}
.fc-ovr b{font-size:46px;line-height:1;font-weight:800;font-family:var(--mono)}
.fc-ovr span{font-size:12px;font-weight:700;letter-spacing:.14em;margin-top:4px}
.fc-ovr i{font-style:normal;font-size:20px;margin-top:6px}
.fc-pic{flex:1;height:112px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.18);display:grid;place-items:center;font-size:40px}
.fc-pic img{width:100%;height:100%;object-fit:cover;display:block}
.fc-name{margin:12px 6px 0;text-align:center;font-weight:800;font-size:14.5px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:2.6em}
.fc-by{text-align:center;font-size:11.5px;opacity:.8;margin:3px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-rule{height:0;border-top:1.5px solid var(--fc-line);margin:9px 14px 9px}
.fc-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;padding:0 10px;font-family:var(--mono)}
.fc-stats div{display:flex;align-items:baseline;gap:8px}
.fc-stats b{font-size:19px;min-width:44px;text-align:right;white-space:nowrap}
.fc-stats b small{font-size:10.5px;font-weight:600;margin-left:1px;opacity:.8}
.fc-stats em{font-style:normal}
.fc-stats span{white-space:nowrap;font-size:12.5px;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-weight:600}
.fc-foot{margin-top:auto;margin-bottom:22px;text-align:center;font-size:11.5px;opacity:.75}
#cardBtn[hidden]{display:none}
@media (prefers-reduced-motion:reduce){ .pk-pack,.pk-shine,.fc.t-icon{animation:none} .fcard.show{animation:none;opacity:1;transform:none} }
/* ── 채점 분석 리포트 (C-2) ── */
.report{position:fixed;inset:0;background:rgba(10,10,10,.55);display:grid;place-items:center;z-index:25;padding:16px}
.rp-box{background:var(--paper);color:var(--ink);border-radius:18px;width:100%;max-width:680px;max-height:calc(100vh - 32px);overflow:auto;
  padding:20px 22px 22px;box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}
.rp-box h4{margin:18px 0 8px;font-size:14.5px}
.rp-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rp-score{width:104px;height:104px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;color:#2b1f00;background:#e5bd4f}
.rp-score b{font-size:40px;line-height:1;font-family:var(--mono)}
.rp-score span{font-size:12px;font-weight:700;margin-top:4px;letter-spacing:.04em}
.rp-score.t-icon{background:linear-gradient(135deg,#7ee8fa,#eec0c6 50%,#d4a017);color:#1d1440}
.rp-score.t-silver{background:#c9ced6;color:#1d232b} .rp-score.t-bronze{background:#c98b5a;color:#2a160a}
.rp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;min-width:240px}
.rp-stats div{background:var(--bg);border-radius:10px;padding:8px 6px;text-align:center;font-size:13px;color:var(--muted)}
.rp-stats b{font-size:20px;color:var(--ink);font-family:var(--mono)}
.rp-stats span{display:block;font-size:11.5px;margin-top:2px}
.rp-rule{font-size:11.5px;color:var(--muted);margin:10px 0 0}
.rp-focus{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;line-height:1.55}
.rp-cat{margin:10px 0 12px}
.rp-ch{display:flex;justify-content:space-between;font-size:14.5px} .rp-ch span{font-size:12.5px;color:var(--muted)}
.rp-cb{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin:4px 0}
.rp-cb i{display:block;height:100%;background:var(--warn)}
.rp-why{font-size:13px;color:var(--muted)}
.rp-ex{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:4px}

<script>
let DATA = /*__DATA__*/null;
const WEB_ID = new URLSearchParams(location.search).get("v");   // 웹판: study.html?v=<영상ID>
const AUDIO_B64 = "";

/* ════════════════════════════════════════════════════════════════════
   저장 창구 (Store)
   ─ 진도를 '어디에' 저장할지는 이 창구만 안다.
   ─ 지금(1단계): 브라우저 저장소(localStorage)
   ─ 2단계: 내 Mac 프로그램(로컬 서버) / 3단계: Supabase 로 안쪽만 바꾸면
     나머지 코드는 그대로 쓴다.
   ════════════════════════════════════════════════════════════════════ */
const Store = {
  prefix: "dictation:v2:",
  load(videoKey) {
    try { return JSON.parse(localStorage.getItem(this.prefix + videoKey)); } catch (e) { return null; }
  },
  save(videoKey, progress) {
    if (window.__signingOut) return false;   // 웹판 로그아웃 중: 지운 진도를 다시 쓰지 않음
    try { localStorage.setItem(this.prefix + videoKey, JSON.stringify(progress)); return true; }
    catch (e) { console.warn("저장 실패", e); return false; }
  },
  // 옛 버전(v1) 진도 찾기: 같은 영상으로 만든 예전 페이지의 기록
  findLegacy(videoId, created) {
    const out = [];
    try {
      const exact = "dictation:" + videoId + ":" + created;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith("dictation:" + videoId + ":") && !k.startsWith(this.prefix)) {
          const v = JSON.parse(localStorage.getItem(k));
          if (v && v.items) out.push({ key: k, exact: k === exact, state: v });
        }
      }
    } catch (e) {}
    return out.sort((a, b) => b.exact - a.exact);
  },
};

/* ════════════════════════════════════════════════════════════════════
   글자 다루기 (채점·문장 맞추기에 공통으로 쓰는 도구)
   ════════════════════════════════════════════════════════════════════ */
// 말버릇: 들려도 안 써도 되고, 써도 틀리지 않는 단어
const FILLERS = new Set(["um", "umm", "uh", "uhh", "uhm", "er", "erm", "ah", "hmm", "hm", "mm", "mhm", "eh"]);
const tokens = t => t.toLowerCase()
  .replace(/[’‘`]/g, "'").replace(/[“”]/g, '"')
  .replace(/[-–—/]/g, " ")
  .replace(/[^a-z0-9'\s]/g, " ")
  .split(/\s+/).map(w => w.replace(/^'+|'+$/g, "")).filter(Boolean);
const coreTokens = t => tokens(t).filter(w => !FILLERS.has(w));
const display = t => t.replace(/[-–—/]/g, " ").split(/\s+/)
  .map(w => w.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, "")).filter(w => tokens(w).length);
const isFiller = w => FILLERS.has(tokens(w)[0]);

/* ════════════════════════════════════════════════════════════════════
   채점 규칙: 축약형과 풀어 쓴 형태를 같은 것으로 본다
   ─ 단어를 '기본 조각'으로 풀어서 비교한다.  who's → who + 's,  don't → do + not
   ─ 's 는 is/has 둘 다, 'd 는 would/had 둘 다 정답 (뜻이 두 가지라서)
   ─ John's 같은 소유격은 풀지 않는다 (아래 목록에 있는 단어 뒤의 's 만 품)
   ════════════════════════════════════════════════════════════════════ */
const SPECIAL = {
  "won't": ["will", "not"], "can't": ["can", "not"], "cannot": ["can", "not"], "shan't": ["shall", "not"],
  "ain't": ["ain't"], "let's": ["let", "us"], "y'all": ["you", "all"],
  "gonna": ["going", "to"], "wanna": ["want", "to"], "gotta": ["got", "to"],
  "kinda": ["kind", "of"], "sorta": ["sort", "of"], "ok": ["okay"], "alright": ["all", "right"],
};
"zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty"
  .split(" ").forEach((w, i) => SPECIAL[String(i)] = [w]);
"thirty forty fifty sixty seventy eighty ninety".split(" ").forEach((w, i) => SPECIAL[String((i + 3) * 10)] = [w]);
const S_BASES = new Set(("it he she that there here what who where when how why this " +
  "everyone everybody someone somebody nobody nothing something everything one").split(" "));
const D_BASES = new Set("i you he she it we they that there who what".split(" "));
function expandWord(w) {
  if (SPECIAL[w]) return SPECIAL[w];
  let m;
  if ((m = w.match(/^(.+)n't$/))) return [m[1], "not"];
  if ((m = w.match(/^(.+)'(re|ve|ll|m)$/))) return [m[1], { re: "are", ve: "have", ll: "will", m: "am" }[m[2]]];
  if ((m = w.match(/^(.+)'s$/)) && S_BASES.has(m[1])) return [m[1], "'s"];
  if ((m = w.match(/^(.+)'d$/)) && D_BASES.has(m[1])) return [m[1], "'d"];
  return [w];
}
const AMBIG = { "'s": ["is", "has"], "'d": ["would", "had"] };
const same = (a, b) => a === b || (AMBIG[a] || []).includes(b) || (AMBIG[b] || []).includes(a);

/**
 * 정답 문장과 내가 쓴 답을 비교한다.
 * 반환: { seq: 화면에 그릴 순서대로 [{t:"ok"|"miss"|"sub"|"extra"|"filler", w, typed, alt}], ok, total, extra }
 */
function grade(answer, typedText) {
  const words = display(answer).map(w => ({ w, filler: isFiller(w) }));
  const E = [];   // 정답 조각 [{p, wi}]
  words.forEach((o, wi) => { if (!o.filler) tokens(o.w).flatMap(expandWord).forEach(p => E.push({ p, wi })); });
  const T = [];   // 내 답 조각 [{p, gi, surf}]
  tokens(typedText).filter(w => !FILLERS.has(w))
    .forEach((surf, gi) => expandWord(surf).forEach(p => T.push({ p, gi, surf })));

  // 가장 많이 맞는 짝 찾기 (최장 공통 부분열)
  const n = E.length, m = T.length;
  const L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = same(E[i].p, T[j].p) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && same(E[i].p, T[j].p)) { ops.push({ t: "ok", e: E[i], ty: T[j] }); i++; j++; }
    else if (j < m && (i === n || L[i][j + 1] >= L[i + 1][j])) { ops.push({ t: "extra", ty: T[j] }); j++; }
    else { ops.push({ t: "miss", e: E[i] }); i++; }
  }

  // 조각 결과 → 단어 결과로 묶기
  const per = words.map(() => ({ oks: 0, parts: 0, typed: [] }));
  const loose = [];   // 어느 단어에도 속하지 않는 '없는 단어' [{pos, surf, gi}]
  let lastWi = -1;
  ops.forEach((o, k) => {
    if (o.t !== "extra") {
      const r = per[o.e.wi]; r.parts++; if (o.t === "ok") { r.oks++; r.typed.push(o.ty); }
      lastWi = o.e.wi; return;
    }
    const next = ops.slice(k + 1).find(x => x.t !== "extra");
    const nextWi = next ? next.e.wi : words.length;
    if (next && nextWi === lastWi) per[lastWi].typed.push(o.ty);       // 한 단어 안에 끼어든 것
    else loose.push({ pos: nextWi, surf: o.ty.surf, gi: o.ty.gi });
  });
  const surfOf = list => { const seen = new Set(), out = [];
    list.forEach(t => { if (!seen.has(t.gi)) { seen.add(t.gi); out.push(t.surf); } }); return out.join(" "); };

  let seq = [];
  words.forEach((o, wi) => {
    if (o.filler) { seq.push({ t: "filler", w: o.w, wi }); return; }
    loose.filter(x => x.pos === wi).forEach(x => seq.push({ t: "extra", w: x.surf }));
    const r = per[wi], typed = surfOf(r.typed);
    if (r.parts && r.oks === r.parts) {
      const mine = tokens(o.w).join(" ");
      seq.push({ t: "ok", w: o.w, wi, gis: [...new Set(r.typed.map(t => t.gi))].join(","),
                 alt: typed && typed !== mine && !(r.typed.length && typed.replace(/'/g, "") === mine.replace(/'/g, "")) ? typed : "" });
    } else if (typed) seq.push({ t: "sub", w: o.w, wi, typed });
    else seq.push({ t: "miss", w: o.w, wi });
  });
  loose.filter(x => x.pos === words.length).forEach(x => seq.push({ t: "extra", w: x.surf }));

  // 같은 자리의 '없는 단어 + 빠진 단어'는 '바꿔 씀'으로 묶기 (말버릇은 건너뛰고 본다)
  const out = [];
  for (let k = 0; k < seq.length; k++) {
    const a = seq[k]; let b = k + 1; const fill = [];
    while (seq[b] && seq[b].t === "filler") fill.push(seq[b++]);
    const B = seq[b];
    if (a.t === "extra" && B && B.t === "miss") { out.push(...fill, { t: "sub", typed: a.w, w: B.w, wi: B.wi }); k = b; }
    else if (a.t === "miss" && B && B.t === "extra") { out.push({ t: "sub", typed: B.w, w: a.w, wi: a.wi }, ...fill); k = b; }
    else out.push(a);
  }
  seq = out;
  // 내 답 한 단어가 정답 여러 단어에 걸치면(don't → do not) 설명은 마지막 단어에만
  for (let k = 0; k < seq.length - 1; k++)
    if (seq[k].alt && seq[k + 1].t === "ok" && seq[k + 1].gis === seq[k].gis) seq[k].alt = "";
  const total = words.filter(o => !o.filler).length;
  return { seq, total, ok: seq.filter(o => o.t === "ok").length, extra: seq.filter(o => o.t === "extra").length };
}

// 문장 '이름표': 문장 내용으로 만든 짧은 코드. 다시 생성해도 내용이 같으면 같은 이름표.
function hash(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36);
}
function sentenceKeys(sentences) {
  const seen = {};
  return sentences.map(s => {
    const base = hash(coreTokens(s.text).join(" "));
    seen[base] = (seen[base] || 0) + 1;
    return seen[base] > 1 ? base + "-" + seen[base] : base;
  });
}
// 두 글이 얼마나 비슷한지 (0~1): 겹치는 단어 비율
function similarity(a, b) {
  const A = coreTokens(a), B = coreTokens(b);
  if (!A.length || !B.length) return 0;
  const bag = {}; A.forEach(w => bag[w] = (bag[w] || 0) + 1);
  let common = 0; B.forEach(w => { if (bag[w] > 0) { common++; bag[w]--; } });
  return (2 * common) / (A.length + B.length);
}

/* ════════════════════════════════════════════════════════════════════
   진도 형식 (schema 2) — 2·3단계에서도 같은 모양을 쓴다
   {
     schema: 2, video, title,
     cur: 지금 보던 문장 이름표, speed,
     items: { 문장이름표: { typed, status, best, attempts, wrong, lastWrong, lastAt, star, starOff, revealed(정답 본 적 있음) } },
     card / cards: 완료 카드(최근 / 전체 기록), starOnly: ★만 풀기 켜짐 여부, showKo: 해석 펼침 여부, hideTips: 학습 설명 접힘, showKoSub: 이어보기 한국어 자막,
     watched: { 구간번호: 끝까지 들은 시각 },
     events: [ { at, k, n, score, miss:[], sub:[[쓴 것, 정답]], extra:[] } ]   ← 채점 기록
   }
   status: "" | "tried" | "perfect" | "revealed"
   ════════════════════════════════════════════════════════════════════ */
const RANK = { "": 0, revealed: 1, tried: 2, perfect: 3 };
const MAX_EVENTS = 3000;
const newItem = () => ({ typed: "", status: "", best: 0, attempts: 0, wrong: 0, lastWrong: "", lastAt: 0, star: false, starOff: false });
const STAR_AUTO = 5;   // 이만큼 틀리면 자동으로 별표
function mergeItem(a, b) { // 두 기록 합치기 (문장이 합쳐졌을 때 등)

/**

 * entries: [{ pos: 예전 순서(0부터), text: 예전 문장 내용 또는 내가 썼던 답, item }]
 * 1) 내용이 비슷한 문장을 근처(±20문장)에서 찾고
 * 2) 못 찾으면 앞뒤로 찾은 문장들의 위치 차이를 이용해 자리를 짐작한다.

    const j = e.pos + (near[1] - near[0]);

/**
 * 두 진도 합치기 (파일 버전 ↔ 서재, 다른 브라우저끼리)
 * 문장마다 '나중에 푼 쪽'을 기준으로 하되, 색(완벽>시도>정답봄)·최고 점수·정답 본 기록은 좋은/있는 쪽을 살린다.

  const $ = id => document.getElementById(id);
  let audio = DATA.player === "youtube" ? new YTAudio(S, DATA.videoId, $("yt"), DATA.segments) : $("audio");
  if (DATA.player === "youtube") audio.addEventListener("nativeplay", () => playCur());
  const pool = {};   // 복습 모드: 음성 파일마다 재생기 하나씩 (Safari에서 누르자마자 재생되도록 미리 준비)

    if (!S.length) {

      $("dots").hidden = true; document.querySelector(".filters").hidden = true;
    }
  }
  $("script").innerHTML = S.map(s => `<p><span>${s.id}</span>${esc(s.text)}${s.ko ? `<span class="sko">${esc(s.ko)}</span>` : ""}</p>`).join("");

  function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // ── 속도 ──
  const SPEEDS = WEB ? YT_RATES : [0.6, 0.75, 0.9, 1];
  if (WEB) P.speed = snapRate(P.speed || 1);
  $("speeds").innerHTML = SPEEDS.map(v => `<button class="chip" data-v="${v}">${v}×</button>`).join("");
  $("speeds").onclick = e => {
    const v = e.target.dataset.v; if (!v) return;
    P.speed = +v; save(); paintSpeed(); audio.playbackRate = P.speed;
  };
  function paintSpeed() { for (const b of $("speeds").children) b.classList.toggle("on", +b.dataset.v === P.speed); }

  // ── 재생 (문장 구간만) ──
  // 화면 갱신 주기(rAF)마다 확인 + 다른 탭으로 가도 멈추도록 timeupdate로 한 번 더 확인
  let stopAt = null, raf = null;
  const stopIfPast = () => { if (stopAt != null && audio.currentTime >= stopAt) { audio.pause(); stopAt = null; } };
  audio.addEventListener("timeupdate", stopIfPast);
  function playRange(a, b, i = idx) {
    cancelAnimationFrame(raf);
    audio.pause();
    if (REVIEW) audio = audioFor(i);
    audio.playbackRate = P.speed;
    audio.preservesPitch = true;
    audio.currentTime = a;
    resumeTo(b);
  }
  function resumeTo(b) {   // 지금 위치에서 b초까지 재생
    cancelAnimationFrame(raf);
    stopAt = b;
    audio.playbackRate = P.speed;
    const p = audio.play(); if (p && p.catch) p.catch(() => {});
    const tick = () => { stopIfPast(); if (stopAt != null) raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
  }
  const playCur = () => playRange(S[idx].start, S[idx].end);
  const playFromPrev = () => {
    const p = Math.max(0, idx - 1);
    if (REVIEW && S[p].audioUrl !== S[idx].audioUrl) return playCur();   // 다른 영상의 문장이면 이어 듣기 대신 현재 문장
    playRange(S[p].start, S[idx].end);
  };

  // ── 채점 ── (계산은 위쪽 grade(), 여기서는 화면에 그리기만)
  /* ── 구간 이어보기 (10문장씩) ──────────────────────────────────── */
  const BLOCK = 10;
  const blockOf = i => Math.floor(i / BLOCK);
  const blockRange = b => [b * BLOCK, Math.min(S.length - 1, b * BLOCK + BLOCK - 1)];
  const isDone = it => !!(it.status || it.skip);   // 건너뛴 문장도 '끝낸' 것으로 (구간 잠금·완주)
  function blockProgress(b) {
    const [a, z] = blockRange(b); let d = 0;
    for (let i = a; i <= z; i++) if (isDone(get(i))) d++;
    return [d, z - a + 1];
  }
  // 방금 이 문장으로 구간을 다 풀었으면 결과 아래에 '이어보기' 제안
  function blockDoneBlock(before) {
    if (REVIEW) return "";
    const b = blockOf(idx), [d, n] = blockProgress(b), [a, z] = blockRange(b);
    if (!(before < n && d === n)) return "";
    return `<div class="blockdone">🎉 ${a + 1}~${z + 1}번 구간을 다 풀었어요!
      <button class="btn primary" data-watch="${b}">🎬 이어서 들어 보기</button>
      <button class="btn" data-report="${b}">📊 구간 분석</button></div>`;
  }
  /* ── 완료 카드 (모든 문장을 끝냈을 때) ─────────────────────────────
     점수 규칙 (C단계 12번 제안과 같은 기준)
     ─ 문장 점수 = (맞은 단어 − 없는 단어×0.5) ÷ 정답 단어 수, 가장 잘한 점수
     ─ 정답을 본 적 있는 문장은 0점
     ─ 영상 점수 = 문장 점수 평균 → S(아이콘) 95↑ / A(골드) 85↑ / B(실버) 70↑ / C(브론즈)
  ──────────────────────────────────────────────────────────────── */
  const TIERS = [[95, "icon", "ICON", "S"], [85, "gold", "GOLD", "A"], [70, "silver", "SILVER", "B"], [0, "bronze", "BRONZE", "C"]];
  const GLOW = { icon: "#b9f5ff", gold: "#ffe08a", silver: "#e6ebf2", bronze: "#f0b37e" };
  const doneAll = () => S.every((_, i) => isDone(get(i)));
  function cardStats() {
    const its = S.map((_, i) => get(i));
    const sc = its.map(it => it.revealed ? 0 : (it.bestG ?? it.best ?? 0));
    const ovr = Math.round(sc.reduce((a, b) => a + b, 0) / S.length);
    const [, tier, name, letter] = TIERS.find(t => ovr >= t[0]);
    const pct = f => Math.round(its.filter(f).length / S.length * 100);
    const times = P.events.map(e => e.at).filter(Boolean);
    const days = times.length ? Math.max(1, Math.ceil((Date.now() - Math.min(...times)) / 86400000)) : 1;
    return {
      ovr, tier, name, letter, at: Date.now(),
      stats: [
        ["정확", ovr],
        ["완벽", pct(it => it.status === "perfect" && !it.revealed)],
        ["자력", pct(it => !it.revealed)],
        ["도전", its.reduce((a, it) => a + (it.attempts || 0), 0)],
        ["속도", DATA.wpm || 0],
        ["기간", days],
      ],
      units: ["", "%", "%", "회", "wpm", "일"],
    };
  }
  function fillCard(c) {
    $("fc").className = "fc t-" + c.tier;
    $("fcTier").textContent = c.name;
    const [main, ...rest] = DATA.title.split(/\s+\|\s+/);   // "제목 | 연사 | 채널" → 제목 / 나머지
    $("fcName").textContent = main; $("fcBy").textContent = rest.join(" · ");
    $("fcStats").innerHTML = c.stats.map(([k, v], i) =>
      `<div title="${k} ${v}${c.units[i]}"><b><em data-n="${v}">0</em>${c.units[i] ? `<small>${c.units[i]}</small>` : ""}</b><span>${k}</span></div>`).join("");
    const d = new Date(c.at);
    $("fcFoot").textContent = `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} 완주 · ${S.length}문장`;
    $("fcPic").innerHTML = DATA.videoId
      ? `<img alt="" src="https://i.ytimg.com/vi/${encodeURIComponent(DATA.videoId)}/hqdefault.jpg" onerror="this.parentNode.textContent='🎬'">` : "🎬";
    $("pkFlash").style.setProperty("--glow", GLOW[c.tier]);
  }
  function countUp() {
    const els = [$("fcOvr"), ...$("fcStats").querySelectorAll("em")];
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - k, 3);
      els.forEach(el => el.textContent = Math.round(+el.dataset.n * e));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  const reduced = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
  function openCard(withPack, record = true) {
    const c = P.card && !withPack ? P.card : cardStats();
    if (withPack && record) { P.card = c; (P.cards = P.cards || []).push(c); save(); paintCardBtn(); }   // 명예의 전당용 기록
    fillCard(c);
    $("fcOvr").dataset.n = c.ovr;
    $("pack").hidden = false;
    $("fcard").classList.remove("show"); $("pkPack").classList.remove("open"); $("pkFlash").classList.remove("go");
    $("pkActions").hidden = true;
    if (withPack && !reduced()) {
      $("pkPack").hidden = false; $("pkHint").hidden = false; $("pkPack").focus();
    } else revealCard(false);
  }
  function revealCard(anim = true) {
    $("pkPack").classList.add("open"); $("pkHint").hidden = true;
    if (anim) { $("pkFlash").classList.remove("go"); void $("pkFlash").offsetWidth; $("pkFlash").classList.add("go"); }
    setTimeout(() => { $("pkPack").hidden = true; }, anim ? 550 : 0);
    setTimeout(() => {
      $("fcard").classList.add("show"); countUp();
      setTimeout(() => { $("pkActions").hidden = false; $("pkClose").focus(); }, anim ? 900 : 0);
    }, anim ? 260 : 0);
  }
  function closeCard() { $("pack").hidden = true; $("input").focus(); }
  function paintCardBtn() {
    $("cardBtn").hidden = !P.card;
    $("cardPreview").hidden = !!P.card;   // 완주 전에만 미리보기
    if (P.card) $("cardBtn").textContent = `🏆 완료 카드 (${P.card.letter} ${P.card.ovr})`;
  }
  $("pkPack").onclick = () => revealCard(true);
  $("pkPack").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); revealCard(true); } };
  $("pkClose").onclick = closeCard;
  $("cardBtn").onclick = () => openCard(false);
  $("cardPreview").onclick = () => openCard(true, false);
  document.addEventListener("keydown", e => { if (!$("pack").hidden && e.key === "Escape") { e.preventDefault(); closeCard(); } });
  // 채점·정답 보기 직후 호출: 방금 마지막 문장을 끝냈으면 팩 열기
  function maybeFinish(wasAll) { if (!REVIEW && !wasAll && doneAll()) setTimeout(() => openCard(true), 700); }

  /* ── 채점 분석 리포트 (C-2) ─────────────────────────────────────────
     10문장 구간이 끝났을 때 / 영상을 완주했을 때 (언제든 📊 버튼으로)
     ─ 점수: 완주 카드와 같은 기준 (가장 잘한 점수, 정답 본 문장 0점) → S/A/B/C
     ─ 틀린 지점: 채점 기록(events)의 빠뜨린·틀린 단어를 유형으로 나눔 (규칙 기반, 무료·오프라인)
     ─ 다음에 집중할 점: 가장 많은 유형 + 정답 보기·첫 시도 결과로 규칙에 따라 고름
  ──────────────────────────────────────────────────────────────── */
  const FUNC_W = new Set(("a an the to of in on at for from by with about into onto over under and or but so if as than that this these those " +
    "is are was were be been being am do does did have has had it its i you he she we they me him her us them my your his our their " +
    "not no can could will would shall should may might must there here what who whom which when where why how all some any").split(" "));
  const LINK_KINDS = new Set(["link", "ed", "merge", "yod", "flap", "h", "reduce"]);
  const CAT = {
    func:    ["기능어를 빠뜨림", "a, the, to, of 같은 작은 단어는 약하게 발음돼서 잘 안 들려요."],
    ending:  ["어미를 놓침", "-s, -ed, -ing 끝소리가 다음 단어에 묻혀 사라졌어요."],
    spell:   ["들었지만 철자 틀림", "소리는 맞게 들었어요. 철자만 달라요."],
    link:    ["축약·연음 구간", "단어끼리 붙거나 줄어든 소리(they're, want to, cried in)에서 놓쳤어요."],
    unheard: ["아예 못 들음", "내용어를 놓쳤어요. 모르는 단어였거나, 알지만 소리로 못 알아들은 경우예요."],
  };
  const lev = (a, b) => {
    if (Math.abs(a.length - b.length) > 3) return 9;
    let prev = [...Array(b.length + 1).keys()];
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur.push(Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] !== b[j - 1])));
      prev = cur;
    }
    return prev[b.length];
  };
  const stem = w => { for (const e of ["ing", "ed", "es", "s", "d"]) if (w.endsWith(e) && w.length - e.length >= 2) return w.slice(0, -e.length); return w; };
  let strongLink = new Set();
  function classifyMiss(expected, typed, linkWords) {
    const e = (tokens(expected)[0] || ""); if (!e) return null;
    if (e.includes("'")) return "link";
    const t = typed == null ? null : (tokens(typed)[0] || "");
    if (t != null && t !== e && stem(t) === stem(e)) return "ending";
    if (t != null && lev(t, e) <= (e.length <= 6 ? 2 : 3)) return "spell";
    // 작은 단어(an, of…)는 연음에 걸려도 '기능어'로, 줄임말·y연음·-ed처럼 소리가 바뀌는 곳만 '연음'으로
    if (FUNC_W.has(e)) return strongLink.has(e) ? "link" : "func";
    if (linkWords.has(e)) return "link";
    return "unheard";
  }
  function sentScore(it) { return it.revealed ? 0 : (it.bestG ?? it.best ?? 0); }

  function buildReport(a, z) {
    const keyIdx = {}; for (let i = a; i <= z; i++) keyIdx[KEYS[i]] = i;
    const evs = P.events.filter(e => e.k in keyIdx);
    const first = {}, tries = {};
    for (const e of evs) if ("score" in e) { if (!(e.k in first)) first[e.k] = e.score; tries[e.k] = (tries[e.k] || 0) + 1; }
    const rows = [];
    for (let i = a; i <= z; i++) {
      const it = get(i);
      if (!it.status) continue;
      rows.push({ i, score: sentScore(it), first: first[KEYS[i]], revealed: !!it.revealed, star: !!it.star, tries: tries[KEYS[i]] || 0 });
    }
    const n = rows.length;
    const ovr = n ? Math.round(rows.reduce((s, r) => s + r.score, 0) / n) : 0;
    const tier = TIERS.find(t => ovr >= t[0]);
    // 틀린 지점 분류
    const cats = {}, words = {};
    for (const e of evs) {
      if (!("score" in e)) continue;
      const s = S[keyIdx[e.k]], W = display(s.text);
      const tw = kinds => new Set((s.tips || []).filter(t => kinds.has(t.kind)).flatMap(t => t.w.map(i => (tokens(W[i] || "")[0] || ""))));
      const linkWords = tw(LINK_KINDS);
      strongLink = tw(new Set(["reduce", "yod", "ed"]));
      const add = (exp, typed) => {
        const c = classifyMiss(exp, typed, linkWords); if (!c) return;
        const k = exp.toLowerCase() + "|" + (typed || "");
        (cats[c] = cats[c] || { n: 0, ex: {} }).n++;
        const x = cats[c].ex[k] = cats[c].ex[k] || { exp, typed, n: 0, i: keyIdx[e.k] }; x.n++;
        if (c !== "func") words[exp.toLowerCase()] = (words[exp.toLowerCase()] || 0) + 1;
      };
      (e.miss || []).forEach(w => add(w, null));
      (e.sub || []).forEach(([t, w]) => add(w, t));
    }
    const total = Object.values(cats).reduce((s, c) => s + c.n, 0);
    const catList = Object.entries(cats).sort((x, y) => y[1].n - x[1].n).map(([id, c]) => ({
      id, name: CAT[id][0], why: CAT[id][1], n: c.n, pct: Math.round(c.n / total * 100),
      ex: Object.values(c.ex).sort((p, q) => q.n - p.n).slice(0, 4),
    }));
    const firstOk = rows.filter(r => r.first === 100).length;
    const revealed = rows.filter(r => r.revealed).length;
    const retry = rows.filter(r => r.score < 100).sort((p, q) => p.score - q.score || q.tries - p.tries).slice(0, 4);
    // 다음에 집중할 점 (규칙)
    const focus = [];
    const top = catList[0] && catList[0].id;
    if (n && ovr >= 95 && firstOk / n >= 0.8) focus.push("이 구간은 거의 완벽해요. 다음 구간은 <b>1×</b> 속도 그대로 바로 도전해 보세요.");
    if (top === "func") focus.push("작은 단어(a, the, to, of)를 놓치는 편이에요. 다음 구간은 <b>0.75×</b>로 듣고, 문장마다 <b>관사·전치사 개수</b>를 먼저 세어 본 뒤 써 보세요.");
    if (top === "ending") focus.push("끝소리(-s, -ed)를 놓쳐요. 쓰기 전에 <b>시제(과거?)와 단·복수</b>를 문법으로 한 번 더 확인하는 습관을 들여 보세요.");
    if (top === "spell") focus.push(`소리는 잘 들려요. 철자가 틀린 단어(${catList[0].ex.slice(0, 3).map(x => esc(x.exp)).join(", ")})를 채점 결과에서 눌러 <b>단어장</b>에 담아 두세요.`);
    if (top === "link") focus.push("붙어서 들리는 소리에서 놓쳐요. 결과 아래 <b>학습 설명의 🔗 표시</b>를 보고, <b>Shift+Tab</b>(앞 문장부터 이어 듣기)으로 흐름 속에서 다시 들어 보세요.");
    if (top === "unheard") focus.push("모르는 단어가 걸림돌이에요. 놓친 단어를 채점 결과에서 눌러 <b>단어장</b>에 담고, 뜻을 알고 나서 다시 들어 보세요.");
    if (revealed >= 3 || (n && revealed / n >= 0.3)) focus.push(`정답 보기를 ${revealed}번 눌렀어요. 다음엔 정답 보기 전에 <b>0.6×</b>로 한 번, <b>첫 글자 힌트</b>로 한 번 더 시도해 보세요.`);
    if (n && ovr < 70 && !focus.some(f => f.includes("0.75"))) focus.push("이 구간은 지금 수준보다 빨라요. <b>0.75×</b>로 먼저 끝까지 풀고, 다시 1×로 풀어 보세요.");
    if (retry.length && !focus.length) focus.push("아래 '다시 풀어 볼 문장'만 한 번 더 풀어 보세요.");
    // 구간별 막대 (전체 리포트에서만)
    const blocks = [];
    if (z - a + 1 > BLOCK) for (let b = blockOf(a); b <= blockOf(z); b++) {
      const [ba, bz] = blockRange(b), rs = rows.filter(r => r.i >= ba && r.i <= bz);
      blocks.push({ b, a: ba, z: bz, n: rs.length, score: rs.length ? Math.round(rs.reduce((s, r) => s + r.score, 0) / rs.length) : null });
    }
    return { a, z, n, ovr, tier, firstOk, revealed, checks: evs.filter(e => "score" in e).length, cats: catList, retry, focus, blocks,
             words: Object.entries(words).sort((p, q) => q[1] - p[1]).slice(0, 8) };
  }

  function openReport(a, z) {
    const R = buildReport(a, z), whole = z - a + 1 > BLOCK;
    $("rpTitle").textContent = whole ? "📊 전체 분석" : `📊 ${a + 1}~${z + 1}번 구간 분석`;
    if (!R.n) { $("rpBody").innerHTML = `<p class="muted">아직 푼 문장이 없어요. 문장을 풀면 분석이 쌓여요.</p>`; $("report").hidden = false; return; }
    const [, tid, tname, letter] = R.tier;
    const go = i => `<button class="linkbtn" data-goto="${i}">${i + 1}번</button>`;
    $("rpBody").innerHTML = `
      <div class="rp-top">
        <div class="rp-score t-${tid}"><b>${R.ovr}</b><span>${letter} · ${tname}</span></div>
        <div class="rp-stats">
          <div><b>${R.n}</b>/${R.z - R.a + 1}<span>푼 문장</span></div>
          <div><b>${R.firstOk}</b><span>처음에 바로 완벽</span></div>
          <div><b>${R.revealed}</b><span>정답 본 문장</span></div>
          <div><b>${R.checks}</b><span>채점 횟수</span></div>
        </div>
      </div>
      <p class="rp-rule">점수 = 문장마다 가장 잘한 점수의 평균 (없는 단어는 0.5개씩 감점, 정답 본 문장은 0점) · S 95↑ A 85↑ B 70↑ C</p>
      ${R.blocks.length ? `<h4>구간별 점수</h4><div class="rp-bars">${R.blocks.map(b => `<button class="rp-bar" data-rblock="${b.b}" title="${b.a + 1}~${b.z + 1}번 · ${b.n}문장 풀었음">
          <i style="height:${b.score == null ? 0 : Math.max(4, b.score)}%" class="${b.score == null ? "" : b.score >= 95 ? "s" : b.score >= 85 ? "a" : b.score >= 70 ? "b" : "c"}"></i><span>${b.a + 1}</span></button>`).join("")}</div>` : ""}
      <h4>다음에 집중할 점</h4>

  /* ── 학습 설명 (C-1): 발음 포인트(규칙으로 자동) + 문법 노트(notes.txt) ──

  const KIND_ICON = { link: "🔗", ed: "🔗", merge: "🔗", yod: "🔗", flap: "🌀", h: "🌀", reduce: "✂️", silent: "🔇", weak: "🔉" };
  function tipsBlock(seq) {

    if (!all.length && !notes.length) return "";

      `<b>${esc(t.w.map(i => words[i]).join(" "))}</b>` + (t.say && t.kind !== "silent" ? ` <span class="say">→ ${esc(t.say)}</span>` : "") +
      ` <span class="tl">${esc(t.label)}</span><div class="tn">${esc(t.note)}</div></li>`;

  let lastSeq = [];

  /* ── 빈칸 사다리 (C): 원본 사람 목소리 그대로, 빈칸 수로 난이도 조절 ─────────────
     Lv.1 핵심 단어 1~2개 · Lv.2 내용어 절반 · Lv.3 내용어 전부 · Lv.4 + 기능어 절반 · Lv.5 문장 통째로(기본)

  function blanksFor(i) {

    }
    const content = order.filter(k => !FUNC_W.has((W[k] || "").toLowerCase())).length;
    const func = order.length - content;
    const n = LV === 1 ? (order.length >= 14 ? 2 : 1) : LV === 2 ? Math.max(2, Math.ceil(content / 2))
            : LV === 3 ? Math.max(2, content) : content + Math.ceil(func / 2);
    return new Set(order.slice(0, Math.min(n, order.length)));

  let CZ = null;   // 지금 문장의 빈칸 { W, blanks:Set, inputs:[] }
  function renderCloze(i, saved) {
    const W = display(S[i].text), B = blanksFor(i);

        else if (e.key === "Backspace" && !inp.value && j > 0) { e.preventDefault(); CZ.inputs[j - 1].focus(); }
      });

  }

  function focusInput() {

    else $("input").focus();

  // 빈칸 채점: 빈칸마다 grade()로 비교 (축약형 규칙도 그대로). 보이는 단어는 'given'
  function gradeCloze() {
    const seq = [];
    let ok = 0, total = 0, extra = 0;
    CZ.W.forEach((w, k) => {
      if (isFiller(w)) { seq.push({ t: "filler", w, wi: k }); return; }
      if (!CZ.B.has(k)) { seq.push({ t: "ok", w, wi: k, given: true }); return; }

      const v = CZ.inputs.find(x => +x.dataset.k === k).value.trim();
      if (!v) { seq.push({ t: "miss", w, wi: k }); return; }

    return { seq, ok, total, extra };

  function paintLevels() {

  const LV_HELP = { 1: "핵심 단어 1~2개만 빈칸", 2: "중요한 단어 절반이 빈칸", 3: "내용어가 모두 빈칸", 4: "내용어 + 작은 단어 절반이 빈칸", 5: "문장 통째로 받아쓰기" };

    const s = S[idx], it = item(idx);
    it.typed = $("input").value;
    const typed = coreTokens(it.typed);
    if (!typed.length) { $("input").focus(); return; }
    const d = grade(s.text, it.typed);
    const blockBefore = blockProgress(blockOf(idx))[0], wasAll = doneAll();
    const pct = d.total ? Math.round((d.ok / d.total) * 100) : 100;
    const perfect = d.ok === d.total && d.extra === 0;

    // 기록 남기기
    const norm = typed.join(" ");
    it.attempts++; it.lastAt = Date.now(); it.best = Math.max(it.best || 0, pct);
    const gpct = d.total ? Math.max(0, Math.round((d.ok - 0.5 * d.extra) / d.total * 100)) : 100;   // 카드용: 없는 단어 감점
    it.bestG = Math.max(it.bestG || 0, gpct);
    if (!perfect && norm !== it.lastWrong) {   // 같은 답으로 다시 채점하면 안 셈
      it.wrong++; it.lastWrong = norm;
      if (it.wrong >= STAR_AUTO && !it.star && !it.starOff) {   // 직접 해제한 문장은 다시 안 붙임
        it.star = true; setTimeout(() => toast(`${STAR_AUTO}번 틀려서 별표를 붙였어요 ★ 나중에 다시 풀어 봐요`, 3500), 50);
      }
    }
    // 정답을 봤던 문장도 다시 풀면 색이 바뀐다 (정답을 봤다는 사실은 it.revealed로 따로 기억)
    it.status = perfect || it.status === "perfect" ? "perfect" : "tried";
    P.events.push({
      at: it.lastAt, k: KEYS[idx], n: idx + 1, score: pct,
      miss: d.seq.filter(o => o.t === "miss").map(o => o.w),
      sub: d.seq.filter(o => o.t === "sub").map(o => [o.typed, o.w]),
      extra: d.seq.filter(o => o.t === "extra").map(o => o.w),
      alt: d.seq.filter(o => o.alt).map(o => [o.alt, o.w]),   // 축약형/풀어쓴 형태로 다르게 쓴 것
    });
    if (P.events.length > MAX_EVENTS) P.events.splice(0, P.events.length - MAX_EVENTS);

    $("result").innerHTML =
      `<div class="score">${perfect ? "<b>완벽해요 🎉</b>" : `<b>${pct}%</b> · ${d.total}단어 중 ${d.ok}개 맞음${d.extra ? ` · 없는 단어 ${d.extra}개` : ""}`}</div>${renderGrade(d.seq)}${koBlock()}${tipsBlock(d.seq)}${blockDoneBlock(blockBefore)}`;
    $("result").classList.add("show");
    checked = true;
    save(); paintDots(); paintCard();
    maybeFinish(wasAll);
  }

  function checkCloze() {
    const it = item(idx);
    it.typed = clozeTyped();
    if (!CZ.inputs.some(x => x.value.trim())) { focusInput(); return; }
    const d = gradeCloze();
    const blockBefore = blockProgress(blockOf(idx))[0], wasAll = doneAll();
    const pct = d.total ? Math.round(d.ok / d.total * 100) : 100, perfect = d.ok === d.total;
    it.attempts++; it.lastAt = Date.now(); it.best = Math.max(it.best || 0, pct); it.bestG = Math.max(it.bestG || 0, pct);
    if (!perfect && it.typed !== it.lastWrong) {
      it.wrong++; it.lastWrong = it.typed;
      if (it.wrong >= STAR_AUTO && !it.star && !it.starOff) { it.star = true; setTimeout(() => toast(`${STAR_AUTO}번 틀려서 별표를 붙였어요 ★`, 3500), 50); }
    }
    it.status = perfect || it.status === "perfect" ? "perfect" : "tried";
    P.events.push({ at: it.lastAt, k: KEYS[idx], n: idx + 1, score: pct, lv: LV,
      miss: d.seq.filter(o => o.t === "miss").map(o => o.w), sub: d.seq.filter(o => o.t === "sub").map(o => [o.typed, o.w]), extra: [] });
    if (P.events.length > MAX_EVENTS) P.events.splice(0, P.events.length - MAX_EVENTS);
    CZ.inputs.forEach(x => { const o = d.seq.find(q => q.wi === +x.dataset.k); x.classList.toggle("ok", o.t === "ok"); x.classList.toggle("bad", o.t !== "ok"); });
    $("result").innerHTML = `<div class="score">${perfect ? "<b>완벽해요 🎉</b>" : `<b>${pct}%</b> · 빈칸 ${d.total}개 중 ${d.ok}개 맞음`}</div>` +
      `${renderGrade(d.seq)}${koBlock()}${tipsBlock(d.seq)}${blockDoneBlock(blockBefore)}`;
    $("result").classList.add("show");
    checked = true;
    save(); paintDots(); paintCard();
    maybeFinish(wasAll);
  }

  function reveal() {
    const it = item(idx);
    if (LV < 5 && CZ) CZ.inputs.forEach(x => { if (!x.value.trim()) { x.value = CZ.W[+x.dataset.k]; x.classList.add("shown"); } });
    const blockBefore = blockProgress(blockOf(idx))[0], wasAll = doneAll();
    if (it.status !== "perfect" && it.status !== "tried") it.status = "revealed";
    it.revealed = true;
    it.lastAt = Date.now();
    P.events.push({ at: it.lastAt, k: KEYS[idx], n: idx + 1, revealed: true });
    $("result").innerHTML = `<div class="score">정답</div>${esc(S[idx].text)}${koBlock()}${tipsBlock(null)}${blockDoneBlock(blockBefore)}`;
    $("result").classList.add("show");
    checked = true;
    save(); paintDots();
    maybeFinish(wasAll);
  }

  function toggleHint() {
    if (LV < 5 && CZ) {   // 빈칸: 첫 글자를 칸 안에 흐리게
      const on = !CZ.inputs[0] || !CZ.inputs[0].placeholder;
      CZ.inputs.forEach(x => { const w = CZ.W[+x.dataset.k]; x.placeholder = on ? w[0] + "_".repeat(Math.max(0, w.length - 1)) : ""; });
      focusInput(); return;
    }
    const h = $("hint");
    if (!h.hidden) { h.hidden = true; return; }
    h.textContent = display(S[idx].text).filter(w => !isFiller(w))
      .map(w => w[0] + "_".repeat(Math.max(0, w.length - 1))).join(" ");
    h.hidden = false;
  }

  // ── 이동 ──
  let checked = false, ready = false;
  function go(i, autoplay = true) {
    if (ready) {
      const t = LV < 5 && CZ ? clozeTyped() : $("input").value;
      const empty = LV < 5 && CZ ? !CZ.inputs.some(x => x.value.trim()) : !t;
      if (!empty || get(idx).typed) item(idx).typed = t;
    }
    ready = true;
    idx = Math.max(0, Math.min(S.length - 1, i));
    P.cur = KEYS[idx];
    save();
    $("cur").textContent = idx + 1;
    if (LV < 5) renderCloze(idx, get(idx).typed); else $("input").value = get(idx).typed || "";
    $("hint").hidden = true;
    $("result").classList.remove("show");
    checked = false;
    paintDots(); paintCard();
    focusInput();
    if (autoplay) playCur();
  }

  // 다음/이전: ★만 풀기 중이면 별표 문장만 오간다
  const starred = () => S.map((_, i) => i).filter(i => get(i).star);
  function step(dir) {
    if (!P.starOnly) { if (idx + dir >= 0 && idx + dir < S.length) go(idx + dir); return; }
    const list = starred();
    const next = dir > 0 ? list.find(i => i > idx) : [...list].reverse().find(i => i < idx);
    if (next == null) toast(dir > 0 ? "마지막 별표 문장이에요" : "첫 번째 별표 문장이에요");
    else go(next);
  }

  function paintCard() {
    const it = get(idx);
    if (REVIEW && S[idx]) $("src").textContent = `${S[idx].src.title.split(/\s+\|\s+/)[0]} · ${S[idx].src.no}번` + (S[idx].why === "star" ? " · ★" : " · 자주 틀림");
    $("star").classList.toggle("on", !!it.star);
    $("star").setAttribute("aria-pressed", it.star ? "true" : "false");
    $("wrongs").textContent = it.wrong ? `틀린 횟수 ${it.wrong}` : "";
    $("wrongs").classList.toggle("hot", (it.wrong || 0) >= 3);
  }

  function toggleStar() {
    const it = item(idx);
    it.star = !it.star;
    it.starOff = !it.star;   // 직접 끈 문장은 자동 별표 대상에서 빠짐
    if (!starred().length) P.starOnly = false;
    save(); paintDots(); paintCard(); $("input").focus();
  }

  function toggleStarOnly() {
    const list = starred();
    if (!list.length) return;
    P.starOnly = !P.starOnly; save();
    if (P.starOnly && !get(idx).star) go(list.find(i => i > idx) ?? list[0]);
    else paintDots();
    $("input").focus();
  }

  function paintDots() {
    const box = $("dots");
    if (!box.children.length) {
      box.innerHTML = S.map((_, i) => `<button class="dot" data-i="${i}">${i + 1}</button>`).join("");
      box.onclick = e => { const i = e.target.dataset.i; if (i != null) go(+i); };
    }
    let done = 0, perfect = 0, skipped = 0;
    [...box.children].forEach((b, i) => {
      const it = get(i);
      const sk = it.skip && !it.status;
      b.className = "dot" + (it.status ? " " + it.status : "") + (sk ? " skip" : "") + (it.star ? " star" : "") + (i === idx ? " cur" : "");
      if (it.status) done++;
      if (sk) skipped++;
      if (it.status === "perfect") perfect++;
    });
    $("bar").style.width = ((done + skipped) / S.length * 100) + "%";
    $("stats").textContent = `푼 문장 ${done}/${S.length - skipped} · 완벽 ${perfect}` + (skipped ? ` · 건너뜀 ${skipped}` : "");
    $("btnSkip").textContent = get(idx).skip ? "건너뛰기 취소" : "건너뛰기";
    const n = starred().length;
    $("starCount").textContent = n;
    $("starOnly").disabled = !n;
    $("starOnly").classList.toggle("on", !!P.starOnly);
    box.classList.toggle("staronly", !!P.starOnly);
    paintWatch();
    $("filterNote").textContent = P.starOnly ? "이전·다음·Enter가 별표 문장으로만 이동해요" : (n ? "" : "다시 풀 문장에 ★를 눌러 두세요");
  }

  // ── 이벤트 ──
  $("play").onclick = () => { playCur(); $("input").focus(); };
  $("btnCheck").onclick = check;
  $("btnReveal").onclick = reveal;
  $("btnSkip").onclick = () => {
    const it = item(idx);
    it.skip = !it.skip; it.lastAt = Date.now();
    P.events.push({ at: Date.now(), k: KEYS[idx], skip: it.skip });
    save();
    if (it.skip && idx < S.length - 1) step(1); else { paintDots(); $("input").focus(); }
  };
  $("btnHint").onclick = toggleHint;
  $("btnPrev").onclick = () => step(-1);
  $("btnNext").onclick = () => step(1);
  $("star").onclick = toggleStar;
  $("starOnly").onclick = toggleStarOnly;
  $("input").addEventListener("input", () => { checked = false; });
  $("input").addEventListener("keydown", e => {
    if (e.isComposing) return;
    if (e.key === "Tab") { e.preventDefault(); e.shiftKey ? playFromPrev() : playCur(); }
    else if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (checked) step(1);
      else check();
    }
  });
  $("reset").onclick = () => {
    if (!confirm("이 영상의 진도를 모두 지울까요?\n(채점 기록은 나중 분석을 위해 남겨 둡니다)")) return;
    const ev = P.events, cards = P.cards; P = blank(); P.events = ev; if (cards) P.cards = cards; paintCardBtn(); P.speed = P.speed || 1; save();
    $("dots").innerHTML = ""; $("input").value = ""; ready = false; go(0, false);
  };

  // ── 진도 내보내기 / 불러오기 (세이브 파일) ──
  function toast(msg, ms = 2600) {
    let t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), ms);
  }
  const doneCount = items => Object.values(items).filter(it => it.status).length;

  $("export").onclick = () => {
    const t = $("input").value; if (t) item(idx).typed = t; save();
    const done = doneCount(P.items);
    const payload = {
      app: "dictation", version: 2, video: VIDEO, title: DATA.title, created: DATA.created,
      sentences: S.length, done, exportedAt: new Date().toISOString(),
      texts: Object.fromEntries(KEYS.map((k, i) => [k, S[i].text])), // 다시 생성해도 문장을 맞출 수 있게
      order: KEYS,
      progress: P,
    };
    const blob = new Blob([JSON.stringify(payload, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
    a.href = URL.createObjectURL(blob);
    a.download = `진도_${DATA.title.replace(/[\\/:*?"<>|]+/g, " ").slice(0, 40).trim()}_${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast(`진도를 파일로 저장했어요 (푼 문장 ${done}/${S.length}) — 다운로드 폴더를 확인하세요`);
  };

  $("import").onclick = () => $("importFile").click();
  $("importFile").onchange = async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    let p;
    try { p = JSON.parse(await f.text()); } catch (err) { alert("진도 파일을 읽을 수 없어요."); return; }
    if (!p || p.app !== "dictation") { alert("받아쓰기 진도 파일이 아니에요."); return; }
    if (p.title !== DATA.title && !confirm(`다른 영상의 진도 파일 같아요.\n파일: ${p.title}\n지금: ${DATA.title}\n\n그래도 불러올까요?`)) return;

    let r, speed = 1, curPos = 0, events = [];
    if (p.version >= 2 && p.progress) {
      // v2: 이름표가 같은 문장은 그대로, 다른 건 문장 내용으로 맞춘다
      const pr = p.progress, order = p.order || Object.keys(pr.items), direct = {}, rest = [];
      order.forEach((k, pos) => {
        const it = pr.items[k]; if (!it) return;
        if (KEYS.includes(k)) direct[k] = it; else rest.push({ pos, text: (p.texts || {})[k], item: it });
      });
      const m = remapEntries(rest, S, KEYS, 0.6);
      for (const [k, it] of Object.entries(m.items)) direct[k] = mergeItem(direct[k], it);
      r = { items: direct, matched: Object.keys(direct).length - m.guessed, guessed: m.guessed, lost: m.lost };
      speed = pr.speed || 1; events = pr.events || [];
      curPos = Math.max(0, KEYS.indexOf(pr.cur));
      if (!KEYS.includes(pr.cur)) curPos = Math.min(order.indexOf(pr.cur), S.length - 1);
    } else if (p.state && p.state.items) {
      // v1(예전 세이브 파일): 같은 페이지면 순서대로, 다시 만든 페이지면 '내가 쓴 답'으로 맞춘다
      const samePage = p.key && p.key.endsWith(":" + DATA.created);
      const entries = Object.entries(p.state.items).map(([i, it]) => ({ pos: +i, text: samePage ? S[+i]?.text : it.text, item: fromV1(it) }))
        .filter(e => e.item.status || e.item.typed).sort((a, b) => a.pos - b.pos);
      r = remapEntries(entries, S, KEYS, samePage ? 0.99 : 0.5);
      speed = p.state.speed || 1; curPos = Math.min(p.state.idx || 0, S.length - 1);
    } else { alert("받아쓰기 진도 파일이 아니에요."); return; }

    const mine = doneCount(P.items);
    if (mine && !confirm(`지금 진도(푼 문장 ${mine}개)를 파일의 진도(푼 문장 ${doneCount(r.items)}개)로 바꿀까요?`)) return;
    P = { ...blank(), items: r.items, speed, events: events.length ? events : P.events, cur: KEYS[Math.max(0, curPos)] };
    save();
    idx = Math.max(0, curPos);
    $("dots").innerHTML = ""; ready = false; paintSpeed(); go(idx, false);
    const moved = r.matched + r.guessed;
    toast(r.guessed || r.lost
      ? `진도를 불러왔어요 — ${moved}문장 옮김${r.guessed ? ` (위치로 짐작 ${r.guessed})` : ""}${r.lost ? `, 못 옮김 ${r.lost}` : ""}`
      : "진도를 불러왔어요", 4500);
  };

  paintSpeed();
  paintCardBtn();
  paintLevels();
  if (LV < 5) {
    $("input").hidden = true; $("cloze").hidden = false;
    $("title").insertAdjacentHTML("beforeend", ` <span class="lvbadge">빈칸 Lv.${LV}</span>`);
    document.querySelector(".keys").innerHTML = "<kbd>Tab</kbd> 다시 듣기 · <kbd>Enter</kbd>/<kbd>Space</kbd> 다음 빈칸 → 마지막 칸에서 Enter 채점 → 한 번 더 Enter 다음 문장 · <kbd>Shift</kbd>+<kbd>Tab</kbd> 앞 문장부터";
  }
  if (DATA.serverMode) { if (!REVIEW) Sync.schedule(); $("syncNote").textContent = "서재에 저장 중"; }
  else if (WEB) (async () => {
    $("shelfLink").hidden = false;
    const guest = "이 기기에만 저장돼요 · 로그인하면 어디서나 이어서";
    const C = window.Cloud;
    try {
      const user = C ? await C.init() : null;
      const btn = $("authBtn");
      if (C) {
        btn.hidden = false;
        btn.textContent = user ? `${user.email} · 로그아웃` : "구글로 로그인";
        btn.onclick = () => user ? C.signOut() : C.signIn();
      }
      if (!user) { $("syncNote").textContent = guest; return; }
      $("syncNote").textContent = "계정과 진도 맞추는 중…";
      Store.save(VIDEO, P);
      await C.mergeAll(mergeProgress);
      const before = JSON.stringify(P);
      P = mergeProgress(P, Store.load(VIDEO)); P.items = P.items || {}; P.events = P.events || [];
      Sync.cloud = true;
      $("syncNote").textContent = "계정에 저장됨";
      if (JSON.stringify(P) !== before) { idx = Math.max(0, KEYS.indexOf(P.cur)); $("dots").innerHTML = ""; ready = false; paintSpeed(); paintCardBtn(); go(idx, false); toast("계정 진도와 맞췄어요"); }
    } catch (e) {
      Sync.cloud = false; Sync.needMerge = !!(C && C.user());   // 합치기 전에는 계정에 쓰지 않는다 (덮어쓰기 방지)
      $("syncNote").textContent = Sync.needMerge ? "계정 저장 못 함 — 이 기기에는 저장됐고, 다음에 다시 보내요" : guest;
    } finally { window.__cloudReady = true; }
  })();
  else (async () => {
    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 1500);
      const r = await fetch(SERVER + "/api/progress/" + encodeURIComponent(VIDEO), { signal: ctl.signal });
      if (!r.ok) return;
      const remote = (await r.json()).data;
      const before = JSON.stringify(P);
      P = mergeProgress(P, remote); P.items = P.items || {}; P.events = P.events || [];
      Sync.online = true; Store.save(VIDEO, P); Sync.push();
      $("syncNote").textContent = "서재와 연결됨";
      if (JSON.stringify(P) !== before) { idx = Math.max(0, KEYS.indexOf(P.cur)); $("dots").innerHTML = ""; ready = false; paintSpeed(); paintCardBtn(); go(idx, false); toast("서재와 진도를 맞췄어요"); }
    } catch (e) { /* 서재가 꺼져 있으면 지금처럼 이 브라우저에만 저장 */ }
  })();
  // 미리보기: 주소 끝에 #card 를 붙여 열면 (기록은 남기지 않고) 지금 진도로 카드 팩을 열어 본다
  if (location.hash === "#card") setTimeout(() => openCard(true, false), 400);
  if (location.hash === "#mycard" && P.card) setTimeout(() => openCard(false), 400);
  save();
  go(idx, false);
  if (migratedMsg) toast(migratedMsg, 4500);
  window.__booted = true;
}
if (!DATA && WEB_ID) {
  fetch("v/" + encodeURIComponent(WEB_ID) + ".json")
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => { DATA = d; boot(); },
          () => { document.querySelector(".wrap").innerHTML =
            "<h1>영상 자료를 불러오지 못했어요</h1><p class='meta'>주소가 맞는지 확인해 주세요. <a class='back' href='./'>← 영상 목록으로</a></p>"; });
} else boot();
</script>
</body>
</html>
