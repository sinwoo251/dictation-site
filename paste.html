<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크립트 보기</title>
<meta name="description" content="유튜브 링크와 대본을 넣으면 소리에 맞춰 스크립트를 보여 줘요">
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#1f1d1a; --muted:#7a746a; --line:#e4ddd0;
  --accent:#2f5d50; --accent-ink:#fff; --soft:#efe9dd; --bad:#c0392b;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --paper:#1f2125; --ink:#ece8e1; --muted:#9a948a; --line:#33363c;
    --accent:#7fc4ae; --accent-ink:#10201b; --soft:#2a2c31; --bad:#f08a7d;
  }
}
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;gap:12px}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
header a{font-size:13px;color:var(--muted)}
header a.back{margin-left:auto}
.authbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;color:inherit}
#loginNote{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.player{position:relative;aspect-ratio:16/9;background:var(--soft);border-radius:12px;overflow:hidden}
.player iframe,#ytFrame{position:absolute;inset:0;width:100%;height:100%;border:0}
#ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;margin:0}
input,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--paper);color:inherit;border-radius:8px;padding:10px 12px;font:inherit;font-size:16px}
textarea{height:140px;resize:vertical;font-size:14px;line-height:1.5}
#paste{display:flex;flex-direction:column;gap:8px}
#paste p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
#go,#open{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 20px;font-size:15px;cursor:pointer}
#go{align-self:flex-start}
#open{flex:none;padding:10px 16px}
.linkrow{display:flex;gap:8px}
.linkrow input{flex:1 1 auto}
#paste #hint{color:var(--ink);font-size:14px}
#pasteTitle{cursor:pointer;font-size:15px;font-weight:600;padding:2px 0}
.pastebody{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#err{color:var(--bad);font-size:14px;margin:0}
#status{color:var(--muted);font-size:14px;margin:0}
#result{display:flex;flex-direction:column;gap:10px}
#now{min-height:3.2em;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  font-size:20px;line-height:1.45;overflow-wrap:anywhere}
#note{color:var(--muted);font-size:13.5px;margin:0}
h2{font-size:15px;margin:6px 0 0}
#full{position:relative;max-height:52vh;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px}
.line{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;font-size:15px;line-height:1.5;padding:7px 10px;border-radius:8px}
button.line{cursor:pointer}
button.line:hover{background:var(--soft)}
.line.on{background:var(--accent);color:var(--accent-ink)}
.ts{flex:none;font-family:var(--mono);font-size:12.5px;line-height:1.8;opacity:.7}
.tx{min-width:0;overflow-wrap:anywhere}
.wrap.loaded #result{order:1}
.wrap.loaded #paste{order:2}
</style>
</head>
<body>
<main class="wrap" id="wrap">
  <header>
    <h1>스크립트 보기</h1>
    <a class="back" href="index.html">받아쓰기 서재</a>
    <button class="authbtn" id="authBtn" type="button" hidden></button>
  </header>
  <p id="loginNote" hidden>로그인하면 대본을 자동으로 가져와요. 지금은 아래 칸에 대본을 붙여 넣어도 돼요.</p>
  <div class="player"><p id="ph">영상이 여기에 나와요</p><div id="ytFrame"></div></div>
  <div class="linkrow">
    <input id="link" type="url" inputmode="url" placeholder="유튜브 링크를 넣어 주세요" aria-label="유튜브 링크">
    <button id="open" type="button">불러오기</button>
  </div>
  <p id="err" role="alert" hidden></p>
  <p id="status" role="status" hidden>대본을 가져오는 중이에요 (1~2분 걸릴 수 있어요)</p>
  <section id="result" hidden>
    <div id="now" aria-live="off"></div>
    <p id="note" hidden></p>
    <h2>전체 스크립트</h2>
    <div id="full"></div>
  </section>
  <div id="paste">
    <p id="hint" hidden>영상을 불러왔어요. 이제 아래 칸에 대본을 붙여 넣어 주세요.</p>
    <details id="pasteBox" open>
      <summary id="pasteTitle">대본 직접 넣기</summary>
      <div class="pastebody">
        <textarea id="script" aria-label="대본" placeholder="대본을 붙여 넣어 주세요&#10;0:00&#10;Hello everyone&#10;0:05&#10;Welcome back"></textarea>
        <p>유튜브 영상 설명의 '스크립트 표시'를 열어 시간과 함께 복사해 넣어 주세요. 대본은 이 브라우저 안에서만 쓰이고 저장되지 않아요.</p>
        <button id="go" type="button">스크립트 보기</button>
      </div>
    </details>
  </div>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="cloud.js"></script>
<script>
const $ = id => document.getElementById(id);

function parseVideoId(raw) {
  let s = (raw || "").trim();
  if (!s) return null;
  if (!/^https?:\/\//i.test(s)) s = "https://" + s;
  let u;
  try { u = new URL(s); } catch { return null; }
  const host = u.hostname.replace(/^(www|m|music)\./, "");
  let id = null;
  if (host === "youtu.be") id = u.pathname.split("/")[1];
  else if (host === "youtube.com" || host === "youtube-nocookie.com") {
    const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([^/]+)/);
    id = m ? m[1] : u.pathname === "/watch" ? u.searchParams.get("v") : null;
  }
  return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
}

/* 유튜브 '스크립트 표시'를 복사한 글 → [{t: 초, text}]. 시간이 하나도 없으면 t는 null */
const STAMP = /^(?:(\d{1,2}):)?(\d{1,2}):(\d{2})(?:\s+(.*))?$/;
const SPOKEN = /^(?:\d+\s*(?:hours?|minutes?|seconds?|시간|분|초)[,\s]*)+$/i;   // 화면 읽기용 시간 줄 ("5 seconds")
function parseScript(raw) {
  const lines = (raw || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.some(l => STAMP.test(l))) return lines.map(text => ({ t: null, text }));
  const out = [];
  let cur = null;
  for (const l of lines) {
    const m = l.match(STAMP);
    if (m) {
      cur = { t: +(m[1] || 0) * 3600 + +m[2] * 60 + +m[3], text: m[4] || "" };
      out.push(cur);
    } else if (cur && !SPOKEN.test(l)) {
      cur.text = cur.text ? cur.text + " " + l : l;
    }
  }
  return out.filter(x => x.text);
}

const fmt = t => {
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = String(t % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${m}:${s}`;
};

const TRANSCRIPT_URL = "https://dictation-transcript.sinwoo0617.workers.dev/api/transcript";
const MAX_SECONDS = 1800;
const AI_NOTE = "AI가 받아쓴 대본이라 틀릴 수 있어요. 들리는 소리와 다르면 직접 고쳐 붙여 넣어도 돼요.";
const FAIL_HINT = {
  busy: "지금 요청이 많아요. 잠시 뒤에 다시 해 보거나, 아래 칸에 대본을 붙여 넣어 주세요.",
  limit: "오늘 사용량을 다 썼어요. 내일 다시 해 보거나, 아래 칸에 대본을 붙여 넣어 주세요.",
  failed: "대본을 자동으로 가져오지 못했어요. 아래 칸에 대본을 붙여 넣어 주세요.",
  nologin: "아래 칸에 대본을 붙여 넣어 주세요.",
  signin: "로그인하면 대본을 자동으로 가져와요. 로그인하거나, 아래 칸에 대본을 붙여 넣어 주세요.",
  login: "로그인이 풀렸어요. 다시 로그인한 뒤 해 보거나, 아래 칸에 대본을 붙여 넣어 주세요.",
  denied: "이 계정은 대본 자동 불러오기를 쓸 수 없어요. 아래 칸에 대본을 붙여 넣어 주세요.",
  long: "30분이 넘는 영상은 자동으로 대본을 가져오지 않아요. 아래 칸에 대본을 붙여 넣어 주세요.",
};
const C = window.Cloud;   // 설정이 없으면 null: 로그인 없이 영상 재생·붙여넣기만 쓴다
const getToken = async () => { try { return C ? await C.token() : null; } catch { return null; } };
let authUser = null, sessionDead = false;
let player = null, playerReady = false, wantId = null, lines = [], rows = [], curIdx = -1;
let loadToken = 0, loading = false, lastFail = null, readyWaiters = [];

function showError(msg) { const e = $("err"); e.textContent = msg; e.hidden = !msg; }

function openVideo(id) {
  if (id === wantId) return;
  $("ph").hidden = true;
  const opened = wantId !== null;
  wantId = id;
  if (opened) { if (playerReady) player.cueVideoById(id); return; }
  const make = () => {
    const first = wantId;
    player = new YT.Player("ytFrame", {
      videoId: first, playerVars: { playsinline: 1, rel: 0, controls: 1 },
      events: {
        onReady: () => {
          playerReady = true; window.__paperReady = true; readyWaiters.splice(0).forEach(f => f());
          if (wantId !== first) player.cueVideoById(wantId);
          setInterval(follow, 250);
        },
        onError: e => showError([100, 101, 150].includes(e.data)
          ? "이 영상은 사이트에서 재생할 수 없어요 (삭제됐거나 퍼가기가 막혔어요). 대본은 그대로 볼 수 있어요."
          : "유튜브 재생 중 문제가 생겼어요. 새로고침해 주세요."),
      },
    });
  };
  if (window.YT && YT.Player) make();
  else {
    window.onYouTubeIframeAPIReady = make;
    const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
  }
}

function showScript(list, note = "") {
  loadToken++; setWaiting(false);
  lines = list; curIdx = -1;
  const timed = list[0].t !== null, box = $("full");
  box.textContent = "";
  rows = list.map(l => {
    const row = document.createElement(timed ? "button" : "div");
    row.className = "line";
    if (timed) {
      row.type = "button";
      const ts = document.createElement("span"); ts.className = "ts"; ts.textContent = fmt(l.t);
      row.append(ts);
      row.onclick = () => { if (playerReady) { player.seekTo(l.t, true); player.playVideo(); } };
    }
    const tx = document.createElement("span"); tx.className = "tx"; tx.textContent = l.text;
    row.append(tx);
    box.append(row);
    return row;
  });
  $("now").textContent = "";
  $("now").hidden = !timed;
  const noTime = timed ? "" : "대본에 시간 정보가 없어서 소리에 맞춰 움직이지는 않아요. 시간과 함께 복사하면 함께 움직여요.";
  $("note").textContent = [note, noTime].filter(Boolean).join(" ");
  $("note").hidden = !$("note").textContent;
  $("result").hidden = false;
  $("hint").hidden = true;
  setPasteBox(false);
  $("wrap").classList.add("loaded");
}

function setPasteBox(open) {
  $("pasteBox").open = open;
  $("pasteTitle").textContent = open ? "대본 직접 넣기" : "대본이 틀렸나요? 직접 넣기";
}

function clearScript() {
  loadToken++; setWaiting(false);
  lines = []; rows = []; curIdx = -1;
  $("script").value = "";
  $("full").textContent = "";
  $("now").textContent = "";
  $("result").hidden = true;
  $("wrap").classList.remove("loaded");
  setPasteBox(true);
}

function setWaiting(on) { loading = on; $("status").hidden = !on; }

function showHint(msg) { const h = $("hint"); h.textContent = msg; h.hidden = false; setPasteBox(true); $("script").focus(); }

/* 영상 길이를 본 뒤 Worker에 대본을 부탁한다. 번호(loadToken)가 달라지면 늦게 온 결과는 버린다 */
async function fetchScript(id) {
  const my = ++loadToken, alive = () => my === loadToken;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const fail = key => { if (!alive()) return; lastFail = key; setWaiting(false); if (key === "login") { sessionDead = true; paintAuth(); }
    showHint(FAIL_HINT[key === "signin" && !C ? "nologin" : key] || FAIL_HINT.failed); };
  lastFail = null; $("hint").hidden = true;
  if (!(await getToken())) return fail("signin");   // 로그인 안 했으면 서버에 묻지 않는다
  if (!alive()) return;
  setWaiting(true);
  if (!playerReady) await Promise.race([new Promise(r => readyWaiters.push(r)), wait(10000)]);
  if (!alive()) return;
  // 재생기가 방금 고른 영상(id)의 정보를 줄 때만 길이를 믿는다 (영상을 바꾼 직후엔 앞 영상 길이가 남아 있을 수 있음)
  const dur = () => { try { return player.getVideoData().video_id === id ? +player.getDuration() || 0 : 0; } catch { return 0; } };
  let d = dur();
  for (let i = 0; !d && i < 12; i++) { await wait(250); if (!alive()) return; d = dur(); }   // 모르면 최대 3초 기다림
  if (d > MAX_SECONDS) return fail("long");
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 120000);
  const token = await getToken();   // 기다리는 사이 표가 새로 바뀌었을 수 있어 다시 받는다
  if (!alive()) return;
  if (!token) { clearTimeout(timer); return fail("login"); }
  let body = null;
  try {
    const r = await fetch(TRANSCRIPT_URL, {
      method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ videoId: id }), signal: ctl.signal,
    });
    body = await r.json();
  } catch { body = null; }
  clearTimeout(timer);
  if (!alive()) return;
  if ($("script").value.trim()) return setWaiting(false);           // 기다리는 사이 직접 붙여 넣었으면 그쪽을 지킴
  const list = body && body.ok === true && typeof body.text === "string" ? parseScript(body.text) : [];
  if (!list.length) return fail(body && !body.ok ? body.reason : "failed");
  showScript(list, AI_NOTE);
}

function openLink() {
  const id = parseVideoId($("link").value);
  if (!id) return showError("유튜브 영상 링크를 확인해 주세요.");
  showError("");
  const same = id === wantId;
  if (wantId && !same) clearScript();
  openVideo(id);
  if (lines.length || (same && loading)) return;
  if (same && lastFail === "busy") return fetchScript(id);   // 바쁨은 다시 눌러 보라고 안내했으니 다시 요청 (영상은 그대로)
  if (same) return showHint($("hint").textContent);
  fetchScript(id);
}

function follow() {
  if (!lines.length || lines[0].t === null) return;
  const now = player.getCurrentTime();
  let idx = -1;
  for (let i = 0; i < lines.length && lines[i].t <= now; i++) idx = i;
  if (idx === curIdx) return;
  rows[curIdx]?.classList.remove("on");
  curIdx = idx;
  $("now").textContent = idx < 0 ? "" : lines[idx].text;
  if (idx < 0) return;
  const row = rows[idx], box = $("full");
  row.classList.add("on");
  box.scrollTop = row.offsetTop - box.clientHeight / 2;
}

function paintAuth() {
  if (!C) return;
  const b = $("authBtn"), on = authUser && !sessionDead;
  b.hidden = false;
  // 표가 죽었으면 로그아웃(기기 진도 삭제)이 아니라 다시 로그인만 권한다
  b.textContent = on ? `${authUser.email} · 로그아웃` : sessionDead ? "다시 로그인" : "구글 로그인";
  b.onclick = () => on ? C.signOut() : C.signIn();
  $("loginNote").hidden = !!authUser || sessionDead;
}
(async () => {
  if (!C) return;
  authUser = await C.init();
  paintAuth();
})();

$("open").onclick = openLink;
$("link").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); openLink(); } };
$("go").onclick = () => {
  const list = parseScript($("script").value);
  if (!list.length) return openLink();
  const id = parseVideoId($("link").value);
  if (!id) return showError("유튜브 영상 링크를 확인해 주세요.");
  showError("");
  showScript(list);
  openVideo(id);
};
</script>
</body>
</html>
