<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>받아쓰기 서재</title>
<meta name="description" content="유튜브 영상으로 영어 문장 받아쓰기 연습">
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#1f1d1a; --muted:#7a746a; --line:#e4ddd0;
  --accent:#2f5d50; --accent-ink:#fff; --ok:#2e7d4f; --soft:#efe9dd; --bad:#c0392b;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --paper:#1f2125; --ink:#ece8e1; --muted:#9a948a; --line:#33363c;
    --accent:#7fc4ae; --accent-ink:#10201b; --ok:#6fd39a; --soft:#2a2c31; --bad:#f08a7d;
  }
}
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:6px 0 20px}
.authbtn{margin-left:auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;color:inherit}
.bands{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.bandf{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.bandf.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.vcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.vcard a{color:inherit;text-decoration:none;display:flex;flex-direction:column;height:100%}
.thumb{aspect-ratio:16/9;background:var(--soft) center/cover no-repeat;position:relative}
.badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px}
.vbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.vcard h3{font-size:15px;line-height:1.35;margin:0}
.vmeta{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.pbar{height:5px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:auto}
.pbar i{display:block;height:100%;background:var(--accent)}
.pct{font-size:12px;color:var(--muted)}
.vcard.off{opacity:.6}
.empty{color:var(--muted);padding:30px 0}
.req{margin-top:36px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.req h2{font-size:17px;margin:0 0 6px}
.req p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.req form{display:flex;gap:8px;flex-wrap:wrap}
.req input{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--bg);color:inherit;border-radius:8px;padding:9px 10px;font-size:14px}
.req button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer}
#reqMsg{margin-top:10px;font-size:13.5px;min-height:1em}
#reqMsg.bad{color:var(--bad)} #reqMsg.ok{color:var(--ok)}
.entrance{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 22px}
.ecard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;color:inherit;text-decoration:none;font:inherit;text-align:left;cursor:pointer}
.ecard:hover{border-color:var(--accent)}
.ecard b{font-size:16px}
.ecard span{color:var(--muted);font-size:13.5px}
@media (max-width:560px){.entrance{grid-template-columns:1fr}}
.fb{margin-top:24px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.fb h2{font-size:17px;margin:0 0 6px}
.fb p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.stars{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.stars label{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.stars label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stars input{position:absolute;opacity:0;width:1px;height:1px}
.stars label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.fb .row{display:flex;gap:8px;flex-wrap:wrap}
.fb input[type=text]{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--bg);color:inherit;border-radius:8px;padding:9px 10px;font-size:14px}
.fb button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer}
.fb button:disabled{opacity:.6;cursor:default}
#fbMsg{margin-top:10px;font-size:13.5px;min-height:1em}
#fbMsg.bad{color:var(--bad)} #fbMsg.ok{color:var(--ok)}
footer{margin-top:40px;color:var(--muted);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>받아쓰기 서재</h1>
    <button class="authbtn" id="authBtn" hidden></button>
  </header>
  <nav class="entrance" id="entrance" aria-label="시작하기">
    <button type="button" class="ecard" id="goStudy"><b>✏️ 받아쓰기 공부</b><span>올라온 영상을 한 문장씩 듣고 받아 적어요. 채점과 진도 기록이 있어요.</span></button>
    <a class="ecard" id="goPaste" href="paste.html"><b>📄 스크립트 보기</b><span>원하는 유튜브 영상을 넣고 소리에 맞춰 움직이는 대본을 봐요.</span></a>
  </nav>
  <p class="sub">로그인하지 않아도 바로 공부할 수 있어요. 처음이라면 <a href="guide.pdf" target="_blank" rel="noopener">이용 안내(PDF)</a>를 먼저 봐 주세요.</p>
  <div class="bands" id="bands"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>아직 올라온 영상이 없어요.</p>
  <div class="ad-slot" hidden></div>

  <section class="req">
    <h2>이 영상으로 공부하고 싶어요</h2>
    <p>유튜브 링크를 남겨 주시면 확인한 뒤 받아쓰기로 만들어 올려요. (영어 영상, 15분 이하 추천)</p>
    <form id="reqForm">
      <input id="reqUrl" type="url" placeholder="https://youtu.be/…" required>
      <input id="reqNote" maxlength="200" placeholder="한 줄 메모 (선택)">
      <button id="reqSend" type="submit">요청 보내기</button>
    </form>
    <div id="reqMsg" role="status"></div>
  </section>

  <section class="fb" id="feedback" hidden>
    <h2>의견 남기기</h2>
    <p>쓰면서 느낀 점을 알려 주세요. 이름이나 이메일은 저장하지 않아요.</p>
    <fieldset style="border:0;padding:0;margin:0 0 10px"><legend class="sr">별점</legend>
    <div class="stars"><label><input type="radio" name="rating" value="1" aria-label="1점">★</label><label><input type="radio" name="rating" value="2" aria-label="2점">★★</label><label><input type="radio" name="rating" value="3" aria-label="3점">★★★</label><label><input type="radio" name="rating" value="4" aria-label="4점">★★★★</label><label><input type="radio" name="rating" value="5" aria-label="5점">★★★★★</label></div></fieldset>
    <div class="row">
      <input id="fbNote" type="text" maxlength="300" placeholder="한 줄 의견 (선택)" aria-label="한 줄 의견">
      <button id="fbSend" type="button">보내기</button>
    </div>
    <div id="fbMsg" role="status"></div>
  </section>

  <footer>
    <a href="privacy.html">개인정보처리방침</a>
    <a href="terms.html">이용약관</a>
    <label id="collectRow" hidden><input type="checkbox" id="collectToggle"> 기록 설정: 이름 없는 채점 기록 보내기</label>
    <span>영상 소리는 유튜브 플레이어로 재생돼요.</span>
  </footer>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="cloud.js"></script>
<script src="collect.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = s => { s = Math.round(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const BANDS = ["입문", "초급", "중급", "중상급", "상급"];
  const C = window.Cloud;

  let cat = [];
  try { cat = await (await fetch("catalog.json", { cache: "no-cache" })).json(); } catch (e) { cat = []; }

  const solved = p => p && p.items ? Object.values(p.items).filter(i => i && i.status).length : 0;
  const local = id => { try { return JSON.parse(localStorage.getItem("dictation:v2:" + id)); } catch (e) { return null; } };
  let cloud = {};

  // ── 로그인 ──
  const user = C ? await C.init() : null;
  if (C) {
    const b = $("authBtn"); b.hidden = false;
    b.textContent = user ? `${user.email} · 로그아웃` : "구글로 로그인";
    b.onclick = () => user ? C.signOut() : C.signIn();
    if (user) try { cloud = await C.loadAll(); } catch (e) { cloud = {}; }
  }

  // ── 영상 카드 ──
  let band = "";
  function paint() {
    const list = cat.filter(v => !band || v.band === band);
    $("empty").hidden = cat.length > 0;
    $("grid").innerHTML = list.map(v => {
      const pct = Math.min(100, Math.round(Math.max(solved(local(v.id)), solved(cloud[v.id])) / Math.max(1, v.count) * 100));
      const body = `
        <div class="thumb" style="background-image:url('https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg')">${v.unplayable ? `<span class="badge">재생 불가</span>` : ""}</div>
        <div class="vbody">
          <h3>${esc(v.title)}</h3>
          <div class="vmeta">${esc(v.band)} · ${v.count}문장 · ${fmt(v.duration)}${v.wpm ? ` · 분당 ${v.wpm}단어` : ""}${v.captions ? " · 공식 자막" : ""}</div>
          <div class="pbar"><i style="width:${pct}%"></i></div>
          <div class="pct">${pct ? `진행 ${pct}%` : "아직 안 풀었어요"}</div>
        </div>`;
      return `<article class="vcard${v.unplayable ? " off" : ""}" data-id="${esc(v.id)}" data-band="${esc(v.band)}">` +
        (v.unplayable ? body : `<a href="study.html?v=${encodeURIComponent(v.id)}">${body}</a>`) + `</article>`;
    }).join("");
  }
  const present = BANDS.filter(b => cat.some(v => v.band === b));
  $("bands").innerHTML = present.length > 1
    ? `<button class="bandf on" data-band="">전체</button>` + present.map(b => `<button class="bandf" data-band="${b}">${b}</button>`).join("") : "";
  $("bands").onclick = e => {
    const b = e.target.closest(".bandf"); if (!b) return;
    band = b.dataset.band;
    for (const x of $("bands").children) x.classList.toggle("on", x === b);
    paint();
  };
  paint();

  // ── 영상 요청 ──
  $("reqForm").onsubmit = async e => {
    e.preventDefault();
    const m = $("reqMsg");
    if (!C) { m.className = "bad"; m.textContent = "지금은 요청을 받을 수 없어요"; return; }
    $("reqSend").disabled = true;
    const r = await C.request($("reqUrl").value, $("reqNote").value);
    $("reqSend").disabled = false;
    m.className = r.ok ? "ok" : "bad";
    m.textContent = r.ok ? "요청을 받았어요. 만들어지면 이 목록에 올라와요 🙌" : r.error;
    if (r.ok) { $("reqUrl").value = ""; $("reqNote").value = ""; }
  };
  // ── 입구 카드 ──
  $("goStudy").onclick = () => $("grid").scrollIntoView({ behavior: "smooth", block: "start" });

  // ── 의견 남기기: 시행일 이후 + 저장소가 있을 때만 ──
  const Col = window.Collect;
  if (C && Col && Col.reached()) {
    $("feedback").hidden = false;
    const qs = new URLSearchParams(location.search), qv = qs.get("v");
    const fromPage = qs.get("from") === "study" ? "study" : "home";
    if (location.hash === "#feedback") {
      $("feedback").scrollIntoView({ block: "start" });
      const f1 = document.querySelector("input[name=rating]"); if (f1) f1.focus({ preventScroll: true });
    }
    const vid = /^[A-Za-z0-9_-]{11}$/.test(qv || "") ? qv : null;
    let sending = false;
    $("fbSend").onclick = async () => {
      if (sending) return;
      const m = $("fbMsg"), pick = document.querySelector("input[name=rating]:checked");
      if (!pick) { m.className = "bad"; m.textContent = "별점을 먼저 골라 주세요"; return; }
      sending = true; $("fbSend").disabled = true;
      let r;
      try { r = await C.feedback(+pick.value, $("fbNote").value, vid, fromPage); }
      catch (e) { r = { ok: false, message: "보내지 못했어요. 잠시 후 다시 해 주세요" }; }
      sending = false; $("fbSend").disabled = false;
      m.className = r.ok ? "ok" : "bad";
      m.textContent = r.ok ? "의견 고마워요! 더 좋게 고칠게요 🙌" : r.message;
      if (r.ok) { $("fbNote").value = ""; pick.checked = false; }
    };
  }
  window.__shelfReady = true;
})();
</script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "da12d0e80661492b81cc91ea7e40d3df"}'></script>
</body>
</html>
